{% extends "base.html" %}
{% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <p><time>{{ post.date | date_to_string }}</time></p>
  {{ post.content }}
  <p>
    {% if post.previous %}<a href="{{ post.previous.url | relative_url }}">← {{ post.previous.title }}</a>{% endif %}
    {% if post.next %}<a href="{{ post.next.url | relative_url }}">{{ post.next.title }} →</a>{% endif %}
  </p>
</article>
{% endblock %}
